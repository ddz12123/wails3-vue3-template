version: '3'

vars:
  APP_NAME: "wails3-vue3-template"
  BIN_DIR: "bin"
  # 模板自带 pnpm-lock.yaml，默认使用 pnpm；
  # 需要换用 npm/yarn/bun 时：wails3 dev PACKAGE_MANAGER=npm
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "pnpm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'
  # 版本号以 build/config.yml 为准，构建时通过 ldflags 注入 main.Version / main.BuildTime
  APP_VERSION:
    sh: go run ./build/version
  BUILD_TIME:
    sh: go run ./build/version -time

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  lint:
    summary: Runs frontend ESLint
    deps:
      - task: common:install:frontend:deps
    cmds:
      - task: common:frontend:run
        vars:
          SCRIPT: lint

  lint:fix:
    summary: Runs frontend ESLint with autofix
    deps:
      - task: common:install:frontend:deps
    cmds:
      - task: common:frontend:run
        vars:
          SCRIPT: lint:fix

  format:
    summary: Formats frontend code with Prettier
    deps:
      - task: common:install:frontend:deps
    cmds:
      - task: common:frontend:run
        vars:
          SCRIPT: format

  format:check:
    summary: Checks frontend formatting with Prettier
    deps:
      - task: common:install:frontend:deps
    cmds:
      - task: common:frontend:run
        vars:
          SCRIPT: format:check

  typecheck:
    summary: Runs frontend TypeScript type check
    deps:
      - task: common:install:frontend:deps
    cmds:
      - task: common:frontend:run
        vars:
          SCRIPT: typecheck

  test:
    summary: Runs frontend and Go tests
    cmds:
      - task: test:frontend
      - task: test:go

  test:frontend:
    summary: Runs frontend unit tests
    deps:
      - task: common:install:frontend:deps
    cmds:
      - task: common:frontend:run
        vars:
          SCRIPT: test

  test:go:
    summary: Runs Go tests
    cmds:
      - go test ./...

  vet:
    summary: Runs Go static analysis
    cmds:
      - go vet ./...

  check:
    summary: Runs lint, formatting, type checks and tests
    cmds:
      - task: lint
      - task: format:check
      - task: typecheck
      - task: vet
      - task: test

  init:
    summary: Initializes the template (replaces module/product placeholders)
    cmds:
      - node scripts/init.mjs {{.CLI_ARGS}}

  clean:
    summary: Trims template docs and local artifacts for a new project
    cmds:
      - node scripts/clean.mjs {{.CLI_ARGS}}

  generate:bindings:
    summary: Generates TypeScript bindings for Go services
    cmds:
      - task: common:generate:bindings

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
